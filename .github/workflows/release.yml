# Build and publish local-apt-repo-updater to TestPyPI and PyPI.
#
# Requires a PyPI and TestPyPI "Trusted Publisher" configured for this repo
# (no API tokens needed) — see https://docs.pypi.org/trusted-publishers/
#
# First release (the project doesn't exist on the index yet): add a
# "pending publisher". PyPI can't prefill this form from a URL, so open the
# page, paste the matching line below into the browser's devtools console,
# check the fields, and click "Add".
#   TestPyPI: https://test.pypi.org/manage/account/publishing/
#     f=document.querySelector('input[name=workflow_filename]').form;Object.entries({project_name:'local-apt-repo-updater',owner:'gene1wood',repository:'local-apt-repo-updater',workflow_filename:'release.yml',environment:'testpypi'}).forEach(([k,v])=>f.elements[k].value=v)
#   PyPI: https://pypi.org/manage/account/publishing/
#     f=document.querySelector('input[name=workflow_filename]').form;Object.entries({project_name:'local-apt-repo-updater',owner:'gene1wood',repository:'local-apt-repo-updater',workflow_filename:'release.yml',environment:'pypi'}).forEach(([k,v])=>f.elements[k].value=v)
#
# Project already exists on the index: these links open the form prefilled.
#   TestPyPI: https://test.pypi.org/manage/project/local-apt-repo-updater/settings/publishing/?provider=github&owner=gene1wood&repository=local-apt-repo-updater&workflow_filename=release.yml&environment=testpypi
#   PyPI:     https://pypi.org/manage/project/local-apt-repo-updater/settings/publishing/?provider=github&owner=gene1wood&repository=local-apt-repo-updater&workflow_filename=release.yml&environment=pypi
#
# Actions are pinned to commit hashes rather than version tags. This is a
# supply-chain-security best practice: a tag like @v4 can be force-moved to
# point at different (possibly malicious) code, but a commit hash can't be.
# The trailing comment records the human-readable version for reference.
# Keep hashes current with Dependabot (see .github/dependabot.yml) or by
# re-checking the action's releases page periodically — these hashes reflect
# what was current when this workflow was last updated and WILL go stale
# over time.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.x"

      - name: Install build tool
        run: python -m pip install --upgrade build --user

      - name: Build a binary wheel and a source tarball
        run: python -m build

      - name: Store the distribution packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: python-package-distributions
          path: dist/

  publish-to-testpypi:
    name: Publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/local-apt-repo-updater
    permissions:
      id-token: write  # required for trusted publishing
    steps:
      - name: Download all the dists
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-to-pypi:
    name: Publish to PyPI
    needs: [build, publish-to-testpypi]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/local-apt-repo-updater
    permissions:
      id-token: write  # required for trusted publishing
    steps:
      - name: Download all the dists
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
