# Run the test suite on every push.
#
# Actions are pinned to commit hashes rather than version tags, matching
# release.yml — see that file's header comment for why.

name: Test

on:
  push:
  workflow_dispatch:

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the package and its dev dependencies
        run: python -m pip install --upgrade ".[dev]"

      - name: Run tests
        run: python -m pytest
